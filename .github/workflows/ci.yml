name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, tests (100% coverage)
    runs-on: ubuntu-latest
    # About 4.5 min of format, lint and typecheck plus about 15 min of tests on a 2-core runner.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      # Unit + integration tests. Integration tests start a real PostgreSQL
      # with Testcontainers, using the Docker engine on the runner.
      - run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end (browser, real API and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A stuck Ubuntu mirror once held this job for its whole 20 minutes: make apt give up on
      # an unresponsive mirror quickly and retry, and keep the browser download in a cache.
      - name: Make apt fail fast on an unresponsive mirror
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @paint/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system libraries
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 300 pnpm --filter @paint/web exec playwright install --with-deps chromium && exit 0
            echo "Install attempt ${attempt} failed or timed out; retrying"
          done
          exit 1

      # Builds the API and the web app, then starts PostgreSQL (Testcontainers),
      # the built API and `vite preview`, and runs Playwright against them.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
