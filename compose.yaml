# Local development database. Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paint
      POSTGRES_PASSWORD: paint
      POSTGRES_DB: paint
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paint -d paint']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
