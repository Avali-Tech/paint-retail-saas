# Local development services. Start with `docker compose up -d`.
# Host ports can be moved with PAINT_*_PORT variables (`pnpm demo` uses them too).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paint
      POSTGRES_PASSWORD: paint
      POSTGRES_DB: paint
    ports:
      - '${PAINT_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paint -d paint']
      interval: 2s
      timeout: 5s
      retries: 15

  # S3-compatible storage for documents (Amazon S3 in production).
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ['server', '-s3', '-dir=/data', '-volume.max=100', '-master.volumeSizeLimitMB=64']
    ports:
      - '${PAINT_STORAGE_PORT:-58333}:8333'
    volumes:
      - storage-data:/data
  # Creates the documents bucket once storage is up.
  storage-init:
    image: curlimages/curl:8.16.0
    depends_on: [storage]
    restart: on-failure
    command: ['-fsS', '-X', 'PUT', 'http://storage:8333/paint-documents']
  # Virus scanning for every upload. Takes ~15 s to load signatures after starting.
  clamav:
    image: clamav/clamav-debian:1.5.4
    ports:
      - '${PAINT_CLAMAV_PORT:-53310}:3310'
  # Catches notification emails; read them at http://localhost:58025.
  mail:
    image: axllent/mailpit:v1.31.3
    ports:
      - '${PAINT_SMTP_PORT:-51025}:1025'
      - '${PAINT_MAIL_PORT:-58025}:8025'

volumes:
  postgres-data:
  storage-data:
